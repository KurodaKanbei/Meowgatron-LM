[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meowgatron-lm"
version = "0.1.0"
description = "A small, readable PyTorch language-model training core."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pyarrow>=14",
    "tokenizers>=0.20",
    "omegaconf>=2.4",
    "tensorboard>=2.15",
]

[project.optional-dependencies]
cpu = ["torch>=2.5"]
cuda = ["torch>=2.5"]
npu = ["torch>=2.5", "torch-npu>=2.5"]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.setuptools.packages.find]
include = ["core*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
